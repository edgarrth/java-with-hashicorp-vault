services:
  vault:
    image: hashicorp/vault:1.18
    container_name: vault-poc
    command: server -dev
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    volumes:
      # Do not mount ./vault over /vault: the official image needs
      # /vault/config, /vault/file and /vault/logs created by the image.
      - ./vault/policies:/vault/policies:ro
      - ./vault/scripts:/vault/scripts:ro
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres:
    image: postgres:16
    container_name: postgres-poc
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: vaultadmin
      POSTGRES_PASSWORD: vaultadmin
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultadmin -d paymentdb"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
